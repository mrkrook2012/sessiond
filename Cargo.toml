[package]
name = "daemon_test"
version = "0.1.0"
edition = "2024"

[dependencies]
bincode-next = "3.1.1"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
daemonize = "0.5.0"
interprocess = "2.4.3"
portable-pty = "0.9.0"
rand = "0.10.2"
mk_utils = {git = "https://github.com/mrkrook2012/mk_utils"} 
ratatui = "0.30.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_yaml = "0.9.34"
tokio = {version = "1.53.1", features=["full"]}
vt100 = "0.16.2"
zbus_systemd = { version = "0.26100", features = ["systemd1", "zbus-async-tokio"] }
tarpc = { version = "0.38", features = [
    "tokio1",
    "serde-transport",
    "unix",
    "serde1",
    "serde-transport-bincode",
] }
futures = "0.3"

[dev-dependencies]
tempfile = "3"
