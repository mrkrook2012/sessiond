[package]
name = "sessiond"
version = "1.0.0"
edition = "2024"
license = "MIT"

[dependencies]
libc = "0.2"
clap = { version = "4.6.6", features = ["derive"] }
color-eyre = "0.6.5"
portable-pty = "0.9.0"
rand = "0.10.2"
ratatui = "0.30.2"
serde = {version = "1.0.229", features = ["derive"]}
serde_yaml = "0.9.34"
tokio = {version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"]}
vt100 = "0.18.1"
zbus_systemd = { version = "0.26100", features = ["systemd1", "zbus-async-tokio"] }
tarpc = { version = "0.38", features = [
    "tokio1",
    "serde-transport",
    "unix",
    "serde1",
    "serde-transport-bincode",
] }
futures = "0.3"
clap_complete = "4.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap-verbosity-flag = { version = "3", features = ["tracing"] }

[dev-dependencies]
tempfile = "3"

[package.metadata.deb]
maintainer = "meindertkrook@gmail.com"
copyright = "2026, Meindert"
extended-description = "Terminal / Systemd manager"
depends = "$auto"
section = "utils"
priority = "optional"
